<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secure Notes — demo frontend</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin: 12px 0; }
    input, textarea { width: 100%; margin: 4px 0; padding: 6px; }
    button { padding: 6px 12px; margin: 4px 4px 4px 0; }
    pre { background: #f6f6f6; padding: 8px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Secure Notes</h1>
  <p>Minimal functional UI for the interview task. Uses the same REST API below.</p>

  <section>
    <h3>Auth</h3>
    <input id="username" placeholder="username" />
    <input id="email" placeholder="email" />
    <input id="password" type="password" placeholder="password (min 8 chars + letter & number)" />
    <input id="interests" placeholder="interests, comma separated (e.g. chess, reading)" />
    <button onclick="register()">Register</button>
    <button onclick="login()">Login</button>
    <button onclick="me()">Me</button>
    <pre id="authOut"></pre>
  </section>

  <section>
    <h3>My notes</h3>
    <input id="noteTitle" placeholder="title" />
    <textarea id="noteContent" placeholder="content"></textarea>
    <button onclick="createNote()">Create note</button>
    <button onclick="loadNotes()">Reload</button>
    <pre id="notesOut"></pre>
  </section>

  <section>
    <h3>Posts (public)</h3>
    <input id="postTitle" placeholder="title" />
    <textarea id="postBody" placeholder="body"></textarea>
    <button onclick="createPost()">Create post</button>
    <button onclick="loadPosts()">Reload</button>
    <pre id="postsOut"></pre>
  </section>

  <script>
    const api = (path, opts = {}) => fetch(path, {
      headers: { 'Content-Type': 'application/json', ...(localStorage.token ? { Authorization: 'Bearer ' + localStorage.token } : {}) },
      ...opts,
    }).then(async (r) => ({ status: r.status, body: await r.json().catch(() => ({})) }));

    const show = (id, v) => { document.getElementById(id).textContent = JSON.stringify(v, null, 2); };

    async function register() {
      const interests = document.getElementById('interests').value.split(',').map((s) => s.trim()).filter(Boolean);
      const r = await api('/api/auth/register', { method: 'POST', body: JSON.stringify({
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value, interests }) });
      if (r.body.token) localStorage.token = r.body.token;
      show('authOut', r); loadNotes();
    }
    async function login() {
      const r = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({
        email: document.getElementById('email').value, password: document.getElementById('password').value }) });
      if (r.body.token) localStorage.token = r.body.token;
      show('authOut', r); loadNotes();
    }
    async function me() { show('authOut', await api('/api/auth/me')); }
    async function createNote() {
      show('notesOut', await api('/api/notes', { method: 'POST', body: JSON.stringify({
        title: document.getElementById('noteTitle').value, content: document.getElementById('noteContent').value }) }));
      loadNotes();
    }
    async function loadNotes() { show('notesOut', await api('/api/notes?limit=10')); }
    async function createPost() {
      show('postsOut', await api('/api/posts', { method: 'POST', body: JSON.stringify({
        title: document.getElementById('postTitle').value, body: document.getElementById('postBody').value }) }));
      loadPosts();
    }
    async function loadPosts() { show('postsOut', await api('/api/posts?limit=10')); }
    loadPosts();
  </script>
</body>
</html>
